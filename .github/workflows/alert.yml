name: IV Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟运行
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run IV monitor
        env:
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          sed -i "s/YOUR_PUSHDEER_KEY/$PUSHDEER_KEY/" iv_monitor.py
          sed -i "s/YOUR_TELEGRAM_BOT_TOKEN/$TG_BOT_TOKEN/" iv_monitor.py
          sed -i "s/YOUR_TELEGRAM_CHAT_ID/$TG_CHAT_ID/" iv_monitor.py
          python iv_monitor.py
