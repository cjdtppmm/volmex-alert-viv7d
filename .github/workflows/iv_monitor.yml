name: IV Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python iv_monitor.py

      - name: Commit status
        run: |
          git config user.name "iv-monitor-bot"
          git config user.email "bot@github.com"
          git add iv_status.json || true

          git pull --rebase
          
          git commit -m "update iv status" || true
          git push
